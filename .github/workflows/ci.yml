name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  tests:
    name: Run e2e tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.6
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          NODE_ENV: test
          CI: true
          AUTH_SESSION_SECRET: testsecret
          OWNER_ID: "123"
          # Dummy Firebase env to avoid hard failures if accessed; tests should avoid real calls
          FIREBASE_PRIVATE_KEY: dummy
          FIREBASE_PROJECT_ID: dummy
          FIREBASE_SENDER_ID: dummy
          FIREBASE_CLIENT_EMAIL: dummy@example.com
          FIREBASE_CLIENT_PASSWORD: dummy
        run: npm run test

  build:
    name: Webpack build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.6
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run webpack build
        env:
          NODE_ENV: production
        run: npm run build
