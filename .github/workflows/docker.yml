name: Build and Push Docker (GHCR)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: vars
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [ "$BRANCH" = "main" ]; then TAG="main"; else TAG="dev"; fi
          SHA_TAG="sha-${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "SHA_TAG=$SHA_TAG" >> $GITHUB_OUTPUT

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spl-web:${{ steps.vars.outputs.TAG }}
            ghcr.io/${{ github.repository_owner }}/spl-web:${{ steps.vars.outputs.SHA_TAG }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/spl-web:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/spl-web:cache,mode=max
